x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: BE.settings.production
  DJANGO_DEBUG: "False"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DATABASE_URL: ${DATABASE_URL:-}
  DB_NAME: ${DB_NAME:-}
  DB_USER: ${DB_USER:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_HOST: ${DB_HOST:-}
  DB_PORT: ${DB_PORT:-5432}
  KOPIS_API_KEY: ${KOPIS_API_KEY:-}
  KOPIS_ONGOING_SYNC_DAYS: ${KOPIS_ONGOING_SYNC_DAYS:-30}
  KOPIS_UPCOMING_SYNC_DAYS: ${KOPIS_UPCOMING_SYNC_DAYS:-60}
  KOPIS_SYNC_LOCK_TTL_SECONDS: ${KOPIS_SYNC_LOCK_TTL_SECONDS:-7200}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-ap-northeast-2}
  AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AI_RECOMMENDATION_PROVIDER: ${AI_RECOMMENDATION_PROVIDER:-openai}
  AI_RECOMMENDATION_MAX_OUTPUT_TOKENS: ${AI_RECOMMENDATION_MAX_OUTPUT_TOKENS:-1200}
  AI_RECOMMENDATION_TEMPERATURE: ${AI_RECOMMENDATION_TEMPERATURE:-0.35}
  AI_RECOMMENDATION_CANDIDATE_LIMIT_DEFAULT: ${AI_RECOMMENDATION_CANDIDATE_LIMIT_DEFAULT:-12}
  AI_RECOMMENDATION_DEMO_INTENT_ENABLED: ${AI_RECOMMENDATION_DEMO_INTENT_ENABLED:-True}
  OPENAI_API_SECRET_KEY: ${OPENAI_API_SECRET_KEY:-}
  OPENAI_RECOMMENDATION_MODEL: ${OPENAI_RECOMMENDATION_MODEL:-gpt-4o-mini}
  GMS_API_KEY: ${GMS_API_KEY:-}
  GMS_KEY: ${GMS_KEY:-}
  GMS_OPENAI_BASE_URL: ${GMS_OPENAI_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
  GMS_RECOMMENDATION_MODEL: ${GMS_RECOMMENDATION_MODEL:-gpt-4.1}
  REDIS_URL: ${REDIS_URL:-}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-django-db}
  CELERY_ENABLE_KOPIS_BEAT_SCHEDULE: ${CELERY_ENABLE_KOPIS_BEAT_SCHEDULE:-False}
  CELERY_WORKER_ENABLE_REMOTE_CONTROL: ${CELERY_WORKER_ENABLE_REMOTE_CONTROL:-False}
  CELERY_REDIS_GLOBAL_KEYPREFIX: ${CELERY_REDIS_GLOBAL_KEYPREFIX:-{culturepick-celery}:}
  CELERY_REDIS_RESULT_GLOBAL_KEYPREFIX: ${CELERY_REDIS_RESULT_GLOBAL_KEYPREFIX:-{culturepick-celery-result}:}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:8000"
    environment:
      <<: *app-environment
    command:
      - gunicorn
      - BE.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "1"
      - --timeout
      - "120"

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
    command:
      - celery
      - -A
      - BE
      - worker
      - -l
      - info
      - --concurrency=1
      - --without-mingle
      - --without-gossip

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
    command:
      - celery
      - -A
      - BE
      - beat
      - -l
      - info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
